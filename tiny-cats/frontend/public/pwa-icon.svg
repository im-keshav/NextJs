<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#f43f5e" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Glow Aura -->
  <circle cx="256" cy="265" r="170" fill="url(#catGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Cat Ears -->
  <polygon points="120,130 170,250 100,240" fill="url(#catGrad)" />
  <polygon points="392,130 412,240 342,250" fill="url(#catGrad)" />
  <polygon points="135,160 162,235 118,230" fill="#fda4af" opacity="0.6" />
  <polygon points="377,160 394,230 350,235" fill="#fda4af" opacity="0.6" />

  <!-- Cat Head Base -->
  <path d="M120 250 C120 180, 392 180, 392 250 C392 360, 120 360, 120 250 Z" fill="url(#catGrad)" />

  <!-- Cat Cheeks & Snout -->
  <ellipse cx="215" cy="305" rx="42" ry="32" fill="#fff" opacity="0.9" />
  <ellipse cx="297" cy="305" rx="42" ry="32" fill="#fff" opacity="0.9" />
  <polygon points="256,275 244,290 268,290" fill="#e11d48" />

  <!-- Cat Eyes -->
  <ellipse cx="195" cy="240" rx="30" ry="36" fill="url(#eyeGrad)" />
  <ellipse cx="317" cy="240" rx="30" ry="36" fill="url(#eyeGrad)" />
  <ellipse cx="195" cy="240" rx="10" ry="26" fill="#090d16" />
  <ellipse cx="317" cy="240" rx="10" ry="26" fill="#090d16" />
  <circle cx="202" cy="228" r="6" fill="#fff" />
  <circle cx="324" cy="228" r="6" fill="#fff" />

  <!-- Whiskers -->
  <line x1="140" y1="290" x2="60" y2="280" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  <line x1="135" y1="305" x2="50" y2="310" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  <line x1="372" y1="290" x2="452" y2="280" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  <line x1="377" y1="305" x2="462" y2="310" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
</svg>
